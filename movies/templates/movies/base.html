<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Cinema Vault{% endblock %}</title>
  <style>
    :root { --bg:#121212; --card:#1e1e1e; --gold:#e8b931; --text:#eee; --muted:#999; }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--text); font-family: system-ui, sans-serif; }
    header { text-align:center; padding:24px 0 16px; border-bottom:1px solid #222; }
    header h1 { color:var(--gold); margin:0; font-size:2rem; }
    header p { color:var(--muted); margin:4px 0 0; font-size:.85rem; }
    main { max-width:1000px; margin:0 auto; padding:24px 16px; }
    a { color:var(--gold); text-decoration:none; }
    .chips { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-bottom:24px; }
    .chip { padding:6px 14px; border:1px solid #4a3d12; border-radius:999px; font-size:.85rem; background:#2a2410; }
    .chip.active { background:var(--gold); color:#000; }
    .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:16px; }
    .card { display:block; background:var(--card); border:1px solid #2a2a2a; border-radius:8px; overflow:hidden; color:var(--text); }
    .card img, .poster-ph { display:block; width:100%; aspect-ratio:2/3; object-fit:cover; background:#2a2a2a; }
    .poster-ph { display:flex; align-items:center; justify-content:center; padding:12px; text-align:center; font-weight:bold; }
    .card-body { padding:12px; }
    .card-body h3 { margin:0 0 4px; font-size:1rem; }
    .card-body p { margin:8px 0 0; }
    .year { color:var(--muted); font-size:.8rem; }
    .tag { display:inline-block; padding:1px 8px; margin:4px 4px 0 0; font-size:.7rem; border:1px solid #4a3d12; border-radius:999px; background:#2a2410; color:var(--gold); }
    .score { color:var(--gold); font-weight:bold; }
    .empty { text-align:center; color:var(--muted); }
    .detail { display:flex; gap:24px; flex-wrap:wrap; align-items:flex-start; }
    .detail img, .detail .poster-ph { width:220px; flex:none; border-radius:8px; }
    .detail-info { flex:1; min-width:240px; }
    .rating-box { background:var(--card); border:1px solid #2a2a2a; border-radius:6px; padding:12px; margin-bottom:12px; }
    footer { text-align:center; color:var(--muted); font-size:.75rem; padding:24px 0; }
  </style>
</head>
<body>
  <header>
    <h1>Cinema Vault</h1>
    <p>Descubre tu próxima película favorita</p>
  </header>
  <main>{% block content %}{% endblock %}</main>
  <footer>Cinema Vault — Recomendaciones de películas con tema oscuro</footer>
</body>
</html>
